[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "act1-pipeline"
version = "0.1.0"
description = "Pipeline de scikit-learn para preparación de datos (Actividad 1 - MLE/MLOps, UVG)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Diego Linares" },
    { name = "Andy Fuentes" },
    { name = "Christian Echeverria" },
    { name = "Diederich Solis" },
]
keywords = ["scikit-learn", "pipeline", "mlops", "crisp-dm"]
dependencies = [
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
notebook = ["jupyter", "notebook"]

[project.scripts]
act1-demo = "act1_pipeline.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"act1_pipeline" = ["datasets/*.csv"]
